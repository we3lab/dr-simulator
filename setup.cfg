[metadata]
name = dr-simulator
version = 0.1.0
description = Demand Response Simulaator enables you to sample DR events based on a distribution and optimize your energy flexible process
author = ThyanRevolter
author_email = admkr.2010@gmail.com
license = MIT
url = https://github.com/we3lab/dr-simulator
keywords = demand-response, simulator, energy, forecasting, optimization
classifiers =
    Development Status :: 2 - Pre-Alpha
    Intended Audience :: Developers, Data Scientists, Energy Analysts
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10

[options]
python_requires = >=3.9

[options.packages.find]
where = src

[tool.poetry.dev-dependencies]
pytest = "^7.4.4"
pylint = "^3.0.3"
pytest-cov = "^4.1.0"
pytest-html = ">=3.0.0"
Sphinx = ">=4.2.0"
sphinx_rtd_theme = ">=2.0.0"
black = ">=21.12b0"
flake8 = ">=4.0.0"
tox = ">=3.24.5"

[tool.poetry.dependencies]
numpy = ">=1.22.0"
scipy = ">=1.8.0"
cvxpy = ">=1.4.1"
pandas = ">=2.2.1"
matplotlib = ">=3.2.2"
statsforecast = ">=1.7.1"
statsmodels = ">=0.14.1"
tensorflow = "2.13.0"
holidays = ">=0.41"
bayesian-optimization = ">=1.4.3"
ipykernel = "*"
pylance = ">=0.9.15"

[aliases]
test=pytest